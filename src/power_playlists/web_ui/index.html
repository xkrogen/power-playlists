<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Playlists Configuration Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main Toolbar -->
    <div class="toolbar">
        <button class="btn" id="loadBtn">Load</button>
        <button class="btn" id="saveBtn">Save</button>
        <button class="btn" id="saveAsBtn">Save As</button>
        <div style="margin-left: auto; display: flex; gap: 12px;">
            <button class="btn btn-secondary" id="addNodeBtn">Add Node</button>
        </div>
    </div>

    <!-- Main Canvas -->
    <div class="canvas-container">
        <div id="canvas">
            <!-- Placeholder for test compatibility - Cytoscape.js manages its own rendering -->
            <svg id="connections" style="position: absolute; top: 0; left: 0; width: 0; height: 0; pointer-events: none; z-index: -1;"></svg>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <span id="statusText">Ready</span>
    </div>

    <!-- Add Node Modal -->
    <div id="addNodeModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Add New Node</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="newNodeId">Node ID:</label>
                    <input type="text" id="newNodeId" placeholder="Enter unique node ID">
                </div>
                <div class="form-group">
                    <label for="newNodeType">Node Type:</label>
                    <select id="newNodeType">
                        <option value="">Select node type...</option>
                    </select>
                    <div class="form-description" id="nodeTypeDescription"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="addNodeCancelBtn">Cancel</button>
                <button class="btn btn-primary" id="addNodeConfirmBtn">Add Node</button>
            </div>
        </div>
    </div>

    <!-- Edit Node Modal -->
    <div id="editModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Edit Node</h2>
            </div>
            <div class="modal-body">
                <form id="modalForm"></form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" id="deleteNodeBtn">Delete</button>
                <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
                <button class="btn btn-primary" id="saveNodeBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Error Modal -->
    <div id="errorModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Error</h2>
            </div>
            <div class="modal-body">
                <div class="error-message" id="errorMessage"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="errorOkBtn">OK</button>
            </div>
        </div>
    </div>

    <!-- Template View -->
    <div id="templateView" class="template-view hidden">
        <div class="template-header">
            <div class="template-breadcrumb" id="templateBreadcrumb"></div>
            <div class="template-toolbar">
                <button class="btn btn-secondary" id="exitTemplateBtn">← Back to Overview</button>
                <button class="btn btn-primary" id="addTemplateNodeBtn">Add Node</button>
                <button class="btn" id="saveTemplateBtn">Save Template</button>
            </div>
        </div>
        <div class="template-content">
            <div class="template-sidebar">
                <h3>Template Variables</h3>
                <div id="templateVariables"></div>
                <h3>Instances</h3>
                <div id="templateInstances"></div>
                <button class="btn" id="addInstanceBtn">Add Instance</button>
            </div>
            <div class="template-canvas-container">
                <div id="templateCanvas" style="width: 100%; height: 100%;"></div>
            </div>
        </div>
    </div>

    <!-- Cytoscape.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.3/cytoscape.min.js"></script>
    <!-- Main Application Script -->
    <script src="app.js"></script>
</body>
</html>
